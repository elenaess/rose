plugins { id 'com.android.application' }
android {
    namespace 'br.dev.rose.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'br.dev.rose.launcher'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
